syntax = "proto3";
package inventory;

service InventoryService {
  rpc checkAvailabilityBatch (ProductRequestList) returns (ProductResponseList);
}

message ProductRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message ProductRequestList {
  repeated ProductRequest requests = 1;
}

message ProductResponse {
  string product_id = 1;
  string name = 2;
  int32 quantity = 3;
  double price = 4;
  int32 sale = 5;
}

message ProductResponseList {
  repeated ProductResponse responses = 1;
}