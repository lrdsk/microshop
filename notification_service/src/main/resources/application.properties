spring.application.name=notification_service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5435/notification_db
spring.datasource.username=admin
spring.datasource.password=admin

jpa.hibernate.ddl-auto=none
jpa.hibernate.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092

spring.liquibase.change-log=db.changelog/db.changelog-master.xml

logging.pattern.level=%5p [${spring.application.name:},%X{X-Trace-Id:-}]